<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="100%" height="100%">
  <style>
    .term-title { font-family: 'SF Mono', 'Courier New', monospace; font-size: 14px; font-weight: 600; fill: #58a6ff; }
    .term-cmd { fill: #39d353; font-weight: 700; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: bold; }
  </style>

  <!-- Window Container -->
  <rect x="2" y="2" width="876" height="196" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Top Window Bar -->
  <path d="M 2 14 Q 2 2 14 2 L 866 2 Q 878 2 878 14 L 878 36 L 2 36 Z" fill="#161b22"/>
  <line x1="2" y1="36" x2="878" y2="36" stroke="#30363d" stroke-width="1"/>

  <!-- Traffic Light Window Buttons -->
  <circle cx="20" cy="19" r="5" fill="#ff5f56"/>
  <circle cx="36" cy="19" r="5" fill="#ffbd2e"/>
  <circle cx="52" cy="19" r="5" fill="#27c93f"/>

  <!-- Terminal Command -->
  <text x="24" y="66" class="term-title">
    pedro@github ~ $ <tspan class="term-cmd">tech-stack --list</tspan>
  </text>

  <!-- Badges Row 1 -->
  <g transform="translate(137, 95)">
    <rect width="110" height="32" rx="6" fill="#3776AB" stroke="#30363d" stroke-width="1"/>
    <text x="55" y="20" fill="white" text-anchor="middle" class="badge-txt">Python</text>
  </g>
  <g transform="translate(261, 95)">
    <rect width="110" height="32" rx="6" fill="#FCC624" stroke="#30363d" stroke-width="1"/>
    <text x="55" y="20" fill="#111111" text-anchor="middle" class="badge-txt">Linux</text>
  </g>
  <g transform="translate(385, 95)">
    <rect width="110" height="32" rx="6" fill="#4EAA25" stroke="#30363d" stroke-width="1"/>
    <text x="55" y="20" fill="white" text-anchor="middle" class="badge-txt">Bash</text>
  </g>
  <g transform="translate(509, 95)">
    <rect width="110" height="32" rx="6" fill="#2496ED" stroke="#30363d" stroke-width="1"/>
    <text x="55" y="20" fill="white" text-anchor="middle" class="badge-txt">Docker</text>
  </g>
  <g transform="translate(633, 95)">
    <rect width="110" height="32" rx="6" fill="#F05032" stroke="#30363d" stroke-width="1"/>
    <text x="55" y="20" fill="white" text-anchor="middle" class="badge-txt">Git</text>
  </g>

  <!-- Badges Row 2 -->
  <g transform="translate(137, 140)">
    <rect width="110" height="32" rx="6" fill="#00599C" stroke="#30363d" stroke-width="1"/>
    <text x="55" y="20" fill="white" text-anchor="middle" class="badge-txt">C++</text>
  </g>
  <g transform="translate(261, 140)">
    <rect width="110" height="32" rx="6" fill="#4169E1" stroke="#30363d" stroke-width="1"/>
    <text x="55" y="20" fill="white" text-anchor="middle" class="badge-txt">PostgreSQL</text>
  </g>
  <g transform="translate(385, 140)">
    <rect width="110" height="32" rx="6" fill="#2088FF" stroke="#30363d" stroke-width="1"/>
    <text x="55" y="20" fill="white" text-anchor="middle" class="badge-txt">GitHub Actions</text>
  </g>
  <g transform="translate(509, 140)">
    <rect width="110" height="32" rx="6" fill="#007ACC" stroke="#30363d" stroke-width="1"/>
    <text x="55" y="20" fill="white" text-anchor="middle" class="badge-txt">VS Code</text>
  </g>
  <g transform="translate(633, 140)">
    <rect width="110" height="32" rx="6" fill="#000000" stroke="#30363d" stroke-width="1"/>
    <text x="55" y="20" fill="white" text-anchor="middle" class="badge-txt">Markdown</text>
  </g>
</svg>