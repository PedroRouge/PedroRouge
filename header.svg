<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f14"/>
      <stop offset="50%" stop-color="#0d141b"/>
      <stop offset="100%" stop-color="#070a0e"/>
    </linearGradient>

    <!-- Neon Circuit Glow -->
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#39d353" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#2ea043" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#238636" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3fb950" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#196c2e" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Terminal Box Gradient -->
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <!-- Filter for subtle neon glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="6" y="6" width="888" height="228" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Circuit Background Lines (Left Side) -->
  <g stroke="#238636" stroke-width="1.2" fill="none" opacity="0.35">
    <path d="M 20 50 L 90 50 L 130 90 L 190 90"/>
    <circle cx="190" cy="90" r="3" fill="#39d353"/>

    <path d="M 30 110 L 100 110 L 140 150 L 220 150"/>
    <circle cx="220" cy="150" r="3" fill="#39d353"/>

    <path d="M 40 180 L 120 180 L 150 150 L 250 150"/>
    <circle cx="250" cy="150" r="2.5" fill="#238636"/>

    <path d="M 90 20 L 120 50 L 120 110 L 160 150"/>
    <circle cx="90" cy="20" r="3" fill="#39d353"/>

    <path d="M 170 30 L 200 60 L 260 60"/>
    <circle cx="260" cy="60" r="2.5" fill="#238636"/>
  </g>

  <!-- Circuit Background Lines (Right Side) -->
  <g stroke="#238636" stroke-width="1.2" fill="none" opacity="0.35">
    <path d="M 880 50 L 810 50 L 770 90 L 710 90"/>
    <circle cx="710" cy="90" r="3" fill="#39d353"/>

    <path d="M 870 120 L 800 120 L 760 160 L 690 160"/>
    <circle cx="690" cy="160" r="3" fill="#39d353"/>

    <path d="M 860 190 L 790 190 L 750 150 L 670 150"/>
    <circle cx="670" cy="150" r="2.5" fill="#238636"/>

    <path d="M 730 30 L 700 60 L 640 60"/>
    <circle cx="640" cy="60" r="2.5" fill="#238636"/>
  </g>

  <!-- Sleek Terminal Icon on Right Side -->
  <g transform="translate(740, 75)">
    <!-- Terminal Outer Frame -->
    <rect x="0" y="0" width="105" height="90" rx="12" fill="url(#termGrad)" stroke="#30363d" stroke-width="1.5" />
    <rect x="0" y="0" width="105" height="22" rx="12" fill="#161b22" />
    <!-- Traffic lights -->
    <circle cx="14" cy="11" r="3.5" fill="#ff5f56"/>
    <circle cx="26" cy="11" r="3.5" fill="#ffbd2e"/>
    <circle cx="38" cy="11" r="3.5" fill="#27c93f"/>
    <!-- Terminal prompt symbol >_ -->
    <text x="16" y="58" font-family="'Courier New', monospace" font-size="28" font-weight="900" fill="#39d353" filter="url(#neonGlow)">&gt;_</text>
  </g>

  <!-- Center Title and Subtitle -->
  <g text-anchor="middle">
    <!-- Main Headline -->
    <text x="440" y="112" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="4">HEY! I AM PEDRO</text>

    <!-- Subtitle with Terminal Vibe -->
    <text x="440" y="152" font-family="'SF Mono', 'Courier New', 'Fira Code', monospace" font-size="18" font-weight="700" fill="#39d353" letter-spacing="6" filter="url(#neonGlow)">FUTURE SYSTEMS GRADUATE</text>
  </g>
</svg>
