      font-size: 12px;
      fill: #c9d1d9;
    }
    .wipe {
      animation: reveal 2.5s steps(100, end) forwards;
      opacity: 0;
    }
    @keyframes reveal {
      0% { opacity: 0; clip-path: inset(0 100% 0 0); }
      100% { opacity: 1; clip-path: inset(0 0 0 0); }
    }
