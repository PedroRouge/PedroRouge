<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 200" width="100%" height="100%">
  <style>
    text {
      font-family: monospace;
      font-size: 13px;
    }
    .title {
      fill: #ff7b72;
      font-weight: bold;
    }
    .key {
      fill: #79c0ff;
    }
    .val {
      fill: #c9d1d9;
    }
    .card-row {
      animation: fadeIn 0.8s ease forwards;
      opacity: 0;
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
  </style>
  <rect width="100%" height="100%" fill="#0d1117" rx="6"/>
  <g transform="translate(20, 30)">
    <text x="0" y="0" class="title">pedro@github:~</text>
    <g class="card-row" style="animation-delay: 0.2s;">
      <text x="0" y="35" class="key">Role:</text>
      <text x="110" y="35" class="val">Software Developer & Builder</text>
    </g>
    <g class="card-row" style="animation-delay: 0.35s;">
      <text x="0" y="63" class="key">Stack:</text>
      <text x="110" y="63" class="val">Python, JavaScript, Git</text>
    </g>
    <g class="card-row" style="animation-delay: 0.5s;">
      <text x="0" y="91" class="key">Focus:</text>
      <text x="110" y="91" class="val">Automation & Creative Coding</text>
    </g>
    <g class="card-row" style="animation-delay: 0.6499999999999999s;">
      <text x="0" y="119" class="key">Location:</text>
      <text x="110" y="119" class="val">Argentina</text>
    </g>
    <g class="card-row" style="animation-delay: 0.8s;">
      <text x="0" y="147" class="key">Status:</text>
      <text x="110" y="147" class="val">Building awesome things</text>
    </g>
  </g>
</svg>